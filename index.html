<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yamamoto games</title>
<meta name="description" content="やまもと しょうのブラウザゲーム">
<meta name="theme-color" content="#101e43">
<link rel="icon" href="favicon.svg">
<style>
:root{color-scheme:dark;--bg:#101e43;--text:#edf0ff;--muted:#8d9ebf;--gold:#ffe8a5}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.8}
main{max-width:480px;margin:0 auto;padding:96px 16px 48px}
h1{margin:0 0 48px;font-size:22px;font-weight:700;letter-spacing:.1em;color:var(--gold)}
ul{list-style:none;margin:0;padding:0}
li+li{margin-top:12px}
a{color:var(--text);text-decoration:none}
a:hover{color:var(--gold)}
ul a{font-size:17px}
footer{margin-top:64px;font-size:13px;color:var(--muted)}
footer a{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>yamamoto games</h1>

  <!-- 新しいゲームを追加するときは <li> を1行足す -->
  <ul>
    <li><a href="hoshi-no-matataki/">数えよう！ 星のまたたき</a></li>
  </ul>

  <footer>やまもと しょう <a href="https://x.com/moya_vc" target="_blank" rel="noopener">@moya_vc</a></footer>
</main>
</body>
</html>
