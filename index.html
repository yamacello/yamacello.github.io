<style>
@font-face{font-family:LittleLightsRound;src:url(fonts/little-lights-round.ttf) format("truetype");font-style:normal;font-weight:700;font-display:swap}
:root{color-scheme:dark;--background:#101e43;--foreground:#edf0ff;--primary:#ffe08c;--border:#ffe08c55;--font-round:LittleLightsRound,"Hiragino Maru Gothic ProN","UD Digi Kyokasho N-R","Yu Gothic",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{overscroll-behavior:none;background:#101e43;width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:var(--font-round);color:#edf0ff;font-weight:700;-webkit-font-smoothing:antialiased}

.text-button{letter-spacing:.13em;background:0 0;border:0;border-bottom:1px solid #a0a9b14f;min-height:48px;padding:.7rem 1rem;font-size:16px;line-height:1.7;transition:color .2s,background .2s,opacity .3s,transform .15s}
.text-button:hover{color:#fff}

.start-button{color:#293257;background:#ffe091;border:0;border-radius:100px;min-width:172px;min-height:56px;padding:.7rem 1.6rem;font-size:18px;box-shadow:0 5px #030b2350,0 0 32px #ffce5710}

.count-button{bottom:max(8%,calc(env(safe-area-inset-bottom) + 25px));pointer-events:auto;background:#ffe18d0d;border:1px solid #f6d58078;border-radius:32px;place-items:center;width:90px;height:90px;padding:0;display:grid;position:absolute;left:50%;transform:translate(-50%);box-shadow:0 5px #030b232a}

<body>
<main class="game-shell" id="shell">
  <div class="game-frame" id="frame" data-stage="title">
    <canvas class="game-canvas" id="canvas" aria-hidden="true"></canvas>

    <section class="start-panel" id="startPanel" aria-label="数えよう！ 星のまたたき">
      <h1 aria-label="数えよう！ 星のまたたき"><span>数えよう！</span><span>星のまたたき</span></h1>
      <p class="instruction">光ったら、<br>＋を押してください。</p>
      <button class="text-button start-button waiting" id="startButton" disabled>はじめる</button>
      <p class="sound-note">音あり推奨</p>
    </section>

    <div class="count-ui" id="countUi" hidden>
      <output class="count-number" id="countNumber" aria-live="off">0</output>
      <button class="count-button" id="countButton" aria-label="＋"><span aria-hidden="true">＋</span></button>
    </div>

    <section class="end-panel" id="endPanel" hidden>
      <p class="thanks">プレイありがとうございました。<br>今後も不定期で新作のゲームを<br>公開予定です。<br>よろしければポストの高評価・<br>フォローなどお願いします。</p>
      <p class="author">やまもと しょう <a href="https://x.com/moya_vc" target="_blank" rel="noopener">@moya_vc</a></p>
      <div class="end-buttons">
        <a class="text-button start-button share-button" id="shareButton" target="_blank" rel="noopener">Xでシェア</a>
        <button class="text-button replay-button" id="replayButton">もう一度</button>
      </div>
      <p class="copy-note" id="copyNote" hidden></p>
    </section>

    <div class="pause-screen" id="pauseScreen" hidden>
      <button class="text-button" id="resumeButton">つづける</button>
    </div>
  </div>
</main>

<script>
// ============================================================
//  設定（ここを変えるとゲームの内容が変わります）
// ============================================================

// 光る目の順番（0〜5 は背景画像の6つの目。下の EYES と対応）。
// この長さが「光の総数」になります（今は24回）。
const EYE_ORDER = [0,3,1,5,2,4,1,4,0,2,5,3,2,0,5,3,4,1,3,1,4,2,0,5];

// ＋を押してから次の光が出るまでの待ち時間（秒）。EYE_ORDER より1つ少ない数。
// 実際はゲームごとに 0.8〜1.2 倍のランダムがかかります。
const GAPS = [1.25,2.55,.65,1.8,.92,2.2,1.1,1.62,.86,.32,1.38,.48,.72,.24,1.82,.41,.3,.14,.54,.18,.32,1.22,.12];
const GAP_RANDOM_MIN = 0.8;
const GAP_RANDOM_MAX = 1.2;

// 最初の光が出るまでの待ち時間（秒）
const FIRST_GAP = 0.35;
// 「はじめる」を押してからゲーム開始までの時間（秒）
const INTRO_SECONDS = 1.1;
// ＋を押してから光が消えるまでの時間（秒）
const CLOSE_SECONDS = 0.3;

// 最後の演出（全部数えたあと）のタイミング（秒）
const REVEAL = { gaze: 14, close: 15.9, black: 16.2, end: 17.7 };
// 最後の演出で、各目がまばたきするタイミング（秒）
const REVEAL_BLINKS = [
  [5.85, 9.55, 11.85],
  [6.35, 10.2, 12.4],
  [4.25, 9.85, 11.6],
  [7.8, 10.8, 12.75],
  [3.9, 9.7, 12.05],
  [2.5, 4.9, 10.45, 12.3],
];

// 背景画像（1024x1536）上の目の位置・大きさ
const EYES = [
  { x: 139, y: 823, w: 42, h: 32, dx: 2,  dy: 5, glint: [135, 820] },
  { x: 300, y: 814, w: 44, h: 34, dx: 1,  dy: 5, glint: [296, 811] },
  { x: 604, y: 795, w: 44, h: 32, dx: 0,  dy: 5, glint: [601, 792] },
  { x: 884, y: 815, w: 46, h: 34, dx: -2, dy: 5, glint: [881, 812] },
  { x: 478, y: 876, w: 48, h: 36, dx: 1,  dy: 5, glint: [474, 871] },
  { x: 738, y: 862, w: 46, h: 36, dx: 0,  dy: 6, glint: [734, 859] },
];

// 「Xでシェア」で投稿される文章とURL
const SHARE_TEXT = "『数えよう！ 星のまたたき』をプレイしました！";
const SHARE_URL = "https://yamamotogames.com/hoshi-no-matataki/";

const ART_SRC = "art/bedroom-wide.png";
const KIRA_SRC = "sound/kira.mp3";   // 光が出たときの効果音
const KIRA_VOLUME = 0.8;
const ART_W = 1024, ART_H = 1536;

// ============================================================
//  ここから下はゲームの仕組み
// ============================================================

const TOTAL = EYE_ORDER.length;
const clamp = (v, min = 0, max = 1) => Math.min(max, Math.max(min, v));
const smooth = (v) => { const t = clamp(v); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const fadeOut = (t) => 1 - smooth(t / 0.3);

// 最後の演出での各目の開き具合（1=開いている, 0=閉じている）
function blinkLevels(t) {
  return REVEAL_BLINKS.map((times, i) => {
    const open = times.reduce((acc, bt) => Math.min(acc, Math.max(fadeOut(t - bt), smooth((t - bt - 0.3) / 0.3))), 1);
    return i === 5 ? Math.min(open, fadeOut(t - REVEAL.close)) : open;
  });
}

// ---------- ゲームの進行 ----------
class Game {
  constructor(random = Math.random) {
    this.stage = "title"; this.count = 0; this.eye = 0;
    this.startedAt = 0; this.pausedAt = null;
    this.gaps = [...GAPS]; this.random = random;
  }
  reset(now = 0) {
    this.stage = "title"; this.count = 0; this.eye = 0;
    this.startedAt = now; this.pausedAt = null;
  }
  start(now) {
    if (this.stage !== "title") return false;
    this.gaps = GAPS.map((g) => g * (GAP_RANDOM_MIN + this.random() * (GAP_RANDOM_MAX - GAP_RANDOM_MIN)));
    this.stage = "intro"; this.startedAt = now;
    return true;
  }
  elapsed(now) { return Math.max(0, ((this.pausedAt ?? now) - this.startedAt) / 1000); }
  update(now) {
    if (this.pausedAt !== null) return;
    for (let i = 0; i < 4; i++) {
      const t = this.elapsed(now);
      if (this.stage === "intro" && t >= INTRO_SECONDS) {
        this.stage = "gap"; this.startedAt += INTRO_SECONDS * 1000; continue;
      }
      if (this.stage === "gap") {
        const gap = this.count === 0 ? FIRST_GAP : this.gaps[this.count - 1];
        if (t >= gap) { this.stage = "light"; this.eye = EYE_ORDER[this.count]; this.startedAt += gap * 1000; continue; }
      }
      if (this.stage === "closing" && t >= CLOSE_SECONDS) {
        this.stage = "gap"; this.startedAt += CLOSE_SECONDS * 1000; continue;
      }
      if (this.stage === "reveal" && t >= REVEAL.end) {
        this.stage = "end"; this.startedAt += REVEAL.end * 1000; continue;
      }
      break;
    }
  }
  countLight(now) {
    this.update(now);
    if (this.stage !== "light" || this.pausedAt !== null) return false;
    this.count++;
    this.stage = this.count === TOTAL ? "reveal" : "closing";
    this.startedAt = now;
    return true;
  }
  pause(now) { if (this.pausedAt === null) this.pausedAt = now; }
  resume(now) { if (this.pausedAt !== null) { this.startedAt += now - this.pausedAt; this.pausedAt = null; } }
  snapshot(now) {
    return { stage: this.stage, count: this.count, eye: this.eye, elapsed: this.elapsed(now), paused: this.pausedAt !== null };
  }
}

// ---------- 描画 ----------
class Renderer {
  constructor(image, makeCanvas) {
    this.lastEyeKey = "";
    this.image = image;
    const c = makeCanvas();
    c.width = ART_W; c.height = ART_H;
    const cx = c.getContext("2d", { willReadFrequently: true });
    cx.drawImage(image, 0, 0, ART_W, ART_H);
    this.source = cx.getImageData(0, 0, ART_W, ART_H).data;
    this.patches = EYES.map((e) => { const p = makeCanvas(); p.width = e.w; p.height = e.h; return p; });
    this.patchData = this.patches.map((p) => p.getContext("2d").createImageData(p.width, p.height));
    this.scratch = makeCanvas();
  }
  sample(x, y, ch) {
    const px = Math.max(0, Math.min(ART_W - 1, Math.round(x)));
    const py = Math.max(0, Math.min(ART_H - 1, Math.round(y)));
    return this.source[(py * ART_W + px) * 4 + ch];
  }
  // 目の開閉と視線を画像に反映
  updateEyes(gaze, opens) {
    const key = [gaze, ...opens].map((v) => Math.round(v * 40)).join(":");
    if (key === this.lastEyeKey) return;
    this.lastEyeKey = key;
    EYES.forEach((e, idx) => {
      const data = this.patchData[idx].data;
      const open = opens[idx];
      for (let y = 0; y < e.h; y++) for (let x = 0; x < e.w; x++) {
        const nx = (x - e.w / 2) / (e.w * 0.48), ny = (y - e.h / 2) / (e.h * 0.48);
        const r2 = nx * nx + ny * ny;
        const fall = Math.max(0, 1 - r2) ** 1.4;
        const sx = e.x - e.w / 2 + x - e.dx * gaze * fall;
        const sy = e.y - e.h / 2 + y - e.dy * gaze * fall;
        const lid = clamp((Math.abs(ny) - open * 0.9 + 0.06) * 18) * clamp((1 - r2) * 3) * (1 - open);
        const p = (y * e.w + x) * 4;
        const lidY = e.y + (ny < 0 ? -1 : 1) * e.h * 0.28 + ny * e.h * 0.04;
        const seam = (1 - open) ** 2 * (1 - smooth(Math.abs(ny) / 0.09)) * (1 - smooth((Math.abs(nx) - 0.18) / 0.4)) * 0.48;
        for (let ch = 0; ch < 3; ch++) {
          const eyeC = this.sample(sx, sy, ch);
          const lidC = this.sample(e.x - e.w / 2 + x, lidY, ch);
          data[p + ch] = (eyeC * (1 - lid) + lidC * lid) * (1 - seam);
        }
        data[p + 3] = 255;
      }
      this.patches[idx].getContext("2d").putImageData(this.patchData[idx], 0, 0);
    });
  }
  starTransform(w, h) {
    const s = Math.min(w / ART_W, h / ART_H);
    return { s, x: (w - ART_W * s) / 2, y: (h - ART_H * s) / 2 };
  }
  // 最後の目からズームアウトしていく変換
  transform(w, h, t) {
    const base = this.starTransform(w, h);
    const [gx, gy] = EYES[5].glint;
    const zs = w / 500;
    const zx = base.x + gx * base.s - gx * zs;
    const zy = base.y + gy * base.s - gy * zs;
    return { s: lerp(zs, base.s, t), x: lerp(zx, base.x, t), y: lerp(zy, base.y, t) };
  }
  scene(ctx, tr, gaze, opens) {
    ctx.save();
    ctx.translate(tr.x, tr.y); ctx.scale(tr.s, tr.s);
    ctx.drawImage(this.image, 0, 0, ART_W, ART_H);
    this.updateEyes(gaze, opens);
    EYES.forEach((e, i) => ctx.drawImage(this.patches[i], e.x - e.w / 2, e.y - e.h / 2));
    ctx.restore();
  }
  point(ctx, tr, eye, scaleY, alpha = 1, glow = 1) {
    if (scaleY <= 0.015 || alpha <= 0.001) return;
    const [gx, gy] = EYES[eye].glint;
    this.sparkle(ctx, tr.x + gx * tr.s, tr.y + gy * tr.s, 2.8, scaleY, alpha, glow);
  }
  // 星形の光
  sparkle(ctx, x, y, size, scaleY = 1, alpha = 1, glow = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.scale(1, Math.max(0.001, scaleY));
    const halo = size * lerp(2.2, 5, glow), arm = size * lerp(0.65, 2.5, glow);
    const pinch = size * lerp(0.15, 0.35, glow), core = size * lerp(0.26, 0.55, glow);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, halo);
    g.addColorStop(0, "rgba(255,206,96,.30)");
    g.addColorStop(0.35, "rgba(255,210,101,.09)");
    g.addColorStop(1, "rgba(255,210,101,0)");
    ctx.fillStyle = g; ctx.fillRect(-halo, -halo, halo * 2, halo * 2);
    ctx.fillStyle = "#ffe189"; ctx.shadowColor = "#ffc85b"; ctx.shadowBlur = lerp(1, 6, glow);
    ctx.beginPath();
    ctx.moveTo(0, -arm);
    ctx.quadraticCurveTo(pinch, -pinch, arm, 0);
    ctx.quadraticCurveTo(pinch, pinch, 0, arm);
    ctx.quadraticCurveTo(-pinch, pinch, -arm, 0);
    ctx.quadraticCurveTo(-pinch, -pinch, 0, -arm);
    ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = "#fff1b9";
    ctx.beginPath(); ctx.ellipse(0, 0, core, core, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  sky(ctx, w, h, alpha) {
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    const g = ctx.createRadialGradient(w * 0.5, h * 0.42, 0, w * 0.5, h * 0.5, Math.max(w, h) * 0.8);
    g.addColorStop(0, "#182b59"); g.addColorStop(0.6, "#101e43"); g.addColorStop(1, "#09132f");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }
  paint(ctx, w, h, st) {
    ctx.save();
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, w, h);
    this.sky(ctx, w, h, st.stage === "end" ? 0 : st.stage === "reveal" ? 1 - smooth(st.elapsed / 1.4) : 1);

    // タイトル画面の飾りの光
    if (st.stage === "title" || st.stage === "intro") {
      const a = st.stage === "intro" ? 1 - smooth(st.elapsed / 0.75) : 1;
      this.sparkle(ctx, w * 0.5, h * 0.16, 5, 1, a * 0.95);
      this.sparkle(ctx, w * 0.19, h * 0.27, 2, 1, a * 0.55);
      this.sparkle(ctx, w * 0.82, h * 0.36, 2.7, 1, a * 0.7);
      this.sparkle(ctx, w * 0.24, h * 0.77, 2.2, 1, a * 0.55);
      this.sparkle(ctx, w * 0.78, h * 0.83, 1.7, 1, a * 0.35);
      ctx.restore(); return;
    }
    if (st.stage === "end") { ctx.restore(); return; }

    const base = this.starTransform(w, h);
    if (st.stage === "light") this.point(ctx, base, st.eye, 1, smooth(st.elapsed / 0.16) * (0.96 + 0.04 * Math.cos(st.elapsed * 4)));
    if (st.stage === "closing") this.point(ctx, base, st.eye, fadeOut(st.elapsed));
    if (st.stage !== "reveal") { ctx.restore(); return; }

    // ---- 最後の演出 ----
    const t = st.elapsed;
    if (t >= REVEAL.black) { ctx.restore(); return; }
    const opens = blinkLevels(t);
    const lastOpen = opens[5];
    const zoom = smooth((t - 4.6) / 4.8);
    const tr = this.transform(w, h, zoom);
    const appear = smooth((t - 1.4) / 2.4);
    const full = smooth((t - 2.15) / 1.65);
    const gaze = smooth((t - REVEAL.gaze) / 0.6);
    if (appear > 0) {
      const cw = Math.ceil(w), ch = Math.ceil(h);
      if (this.scratch.width !== cw || this.scratch.height !== ch) { this.scratch.width = cw; this.scratch.height = ch; }
      const sc = this.scratch.getContext("2d");
      sc.clearRect(0, 0, w, h);
      this.scene(sc, tr, gaze, opens);
      const top = tr.y + lerp(734, 0, zoom) * tr.s;
      const bottom = tr.y + lerp(916, ART_H, zoom) * tr.s;
      ctx.save();
      ctx.beginPath(); ctx.rect(0, top, w, bottom - top); ctx.clip();
      ctx.globalAlpha = full * 0.94; ctx.drawImage(this.scratch, 0, 0);
      ctx.restore();
      if (full < 1) {
        const [gx, gy] = EYES[5].glint;
        const cx = tr.x + gx * tr.s, cy = tr.y + gy * tr.s;
        const r = lerp(8, 190, smooth((t - 1.4) / 1.6)) * tr.s;
        sc.globalCompositeOperation = "destination-in";
        const g = sc.createRadialGradient(cx, cy, 0, cx, cy, Math.max(r, 1));
        g.addColorStop(0, "#fff"); g.addColorStop(0.55, "rgba(255,255,255,.96)"); g.addColorStop(1, "rgba(255,255,255,0)");
        sc.fillStyle = g; sc.fillRect(0, 0, w, h);
        sc.globalCompositeOperation = "source-over";
        ctx.save();
        ctx.globalAlpha = smooth((t - 1.4) / 0.75) * (1 - full) * 0.96;
        ctx.drawImage(this.scratch, 0, 0);
        ctx.restore();
      }
      if (zoom < 1 && full > 0.05) {
        const edge = 18 * (1 - zoom);
        const g1 = ctx.createLinearGradient(0, top, 0, top + edge);
        g1.addColorStop(0, "#000"); g1.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g1; ctx.fillRect(0, top, w, edge);
        const g2 = ctx.createLinearGradient(0, bottom - edge, 0, bottom);
        g2.addColorStop(0, "rgba(0,0,0,0)"); g2.addColorStop(1, "#000");
        ctx.fillStyle = g2; ctx.fillRect(0, bottom - edge, w, edge);
      }
    }
    if (t < 2.8) this.point(ctx, tr, 5, lastOpen, 1, 1 - smooth((t - 1.6) / 0.8));
    if (t > REVEAL.black - 0.08) {
      ctx.fillStyle = `rgba(0,0,0,${smooth((t - REVEAL.black + 0.08) / 0.08)})`;
      ctx.fillRect(0, 0, w, h);
    }
    ctx.restore();
  }
}

// ---------- 音 ----------
class Sound {
  constructor() { this.ctx = null; this.master = null; this.background = null; this.disposed = false; this.kiraBuffer = null; }
  async start() {
    try {
      if (this.disposed) return;
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0;
        this.master.connect(this.ctx.destination);
        // 背景の小さなノイズ（夜の空気感）
        const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 4, this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        let v = 0;
        for (let i = 0; i < d.length; i++) { v = (v + 0.018 * (Math.random() * 2 - 1)) / 1.018; d[i] = v; }
        this.background = this.ctx.createBufferSource();
        this.background.buffer = buf; this.background.loop = true;
        const bg = this.ctx.createGain(); bg.gain.value = 0.045;
        this.background.connect(bg); bg.connect(this.master);
        this.background.start();
        fetch(KIRA_SRC).then((r) => r.arrayBuffer())
          .then((b) => new Promise((ok, ng) => this.ctx.decodeAudioData(b, ok, ng)))
          .then((buf) => { this.kiraBuffer = buf; })
          .catch((e) => console.warn("kira load failed", e));
      }
      await this.ctx.resume();
      if (this.disposed) return;
      const now = this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(now);
      this.master.gain.setTargetAtTime(0.8, now, 0.15);
    } catch {}
  }
  noise(gain, dur, freq, delay = 0) {
    if (!this.ctx || !this.master || this.ctx.state !== "running") return;
    const at = this.ctx.currentTime + delay;
    const buf = this.ctx.createBuffer(1, Math.max(1, Math.floor(this.ctx.sampleRate * dur)), this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq;
    const g = this.ctx.createGain(); g.gain.value = gain;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(at); src.stop(at + dur);
    src.onended = () => { src.disconnect(); f.disconnect(); g.disconnect(); };
  }
  tone(freq, gain, dur, delay = 0, type = "sine", endFreq = freq) {
    if (!this.ctx || !this.master || this.ctx.state !== "running") return;
    const at = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(freq, at);
    if (endFreq !== freq) o.frequency.exponentialRampToValueAtTime(endFreq, at + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(gain, at + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(this.master);
    o.start(at); o.stop(at + dur + 0.02);
    o.onended = () => { o.disconnect(); g.disconnect(); };
  }
  // 光が出たときの「kira」（kira.mp3）
  kira() {
    if (!this.ctx || !this.master || !this.kiraBuffer || this.ctx.state !== "running") return;
    const src = this.ctx.createBufferSource(); src.buffer = this.kiraBuffer;
    const g = this.ctx.createGain(); g.gain.value = KIRA_VOLUME;
    src.connect(g); g.connect(this.master); src.start();
    src.onended = () => { src.disconnect(); g.disconnect(); };
  }
  // ＋を押した音（やわらかい「ポン」）
  tap() {
    this.tone(880, 0.16, 0.13, 0, "sine", 520);
    this.tone(1760, 0.03, 0.06, 0, "triangle", 1040);
  }
  switchClick() { this.noise(0.1, 0.028, 2300); this.noise(0.065, 0.019, 1700, 0.036); } // 最後のスイッチ音
  pause() {
    if (!this.ctx || !this.master) return;
    this.master.gain.cancelScheduledValues(this.ctx.currentTime);
    this.master.gain.value = 0;
    this.ctx.suspend().catch(() => {});
  }
  async resume() { await this.start(); }
  fadeOut() { if (this.ctx && this.master) this.master.gain.setTargetAtTime(0, this.ctx.currentTime, 0.12); }
}

// ---------- 画面とボタン ----------
const $ = (id) => document.getElementById(id);
const canvas = $("canvas");
const game = new Game();
const sound = new Sound();
let renderer = null;
let ready = false;
let failed = false;

function renderUI(st) {
  const playing = ["gap", "light", "closing", "reveal"].includes(st.stage);
  $("shell").classList.toggle("night-ended", st.stage === "reveal" || st.stage === "end");
  $("frame").dataset.stage = st.stage;

  const panel = $("startPanel");
  panel.hidden = !(st.stage === "title" || st.stage === "intro");
  panel.classList.toggle("leaving", st.stage === "intro");
  const sb = $("startButton");
  sb.textContent = failed ? "もう一度" : "はじめる";
  sb.disabled = !ready && !failed;
  sb.classList.toggle("waiting", !ready && !failed);
  sb.tabIndex = st.stage === "intro" ? -1 : 0;

  const ui = $("countUi");
  ui.hidden = !playing;
  ui.classList.toggle("leaving", st.stage === "reveal");
  ui.setAttribute("aria-hidden", String(st.stage === "reveal" || st.paused));
  $("countNumber").textContent = st.count;
  $("countButton").disabled = st.stage === "reveal" || st.paused;

  $("endPanel").hidden = st.stage !== "end";
  if (st.stage !== "end") $("copyNote").hidden = true;
  $("pauseScreen").hidden = !st.paused;
}

function onCount() { if (game.countLight(performance.now())) sound.tap(); }

$("startButton").addEventListener("click", () => {
  if (failed) { location.reload(); return; }
  if (!ready) return;
  sound.start();
  game.start(performance.now());
});
const cb = $("countButton");
cb.addEventListener("pointerdown", (e) => { if (e.button === 0) { e.preventDefault(); onCount(); } });
cb.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); onCount(); } });
cb.addEventListener("click", (e) => { if (e.detail === 0) onCount(); });
$("resumeButton").addEventListener("click", () => { sound.resume(); game.resume(performance.now()); });
$("replayButton").addEventListener("click", () => { game.reset(performance.now()); sound.pause(); });

$("shareButton").href = "https://x.com/intent/post?text=" + encodeURIComponent(SHARE_TEXT) + "&url=" + encodeURIComponent(SHARE_URL);

// 埋め込み先によっては新しいタブを開けないので、そのときは文章をコピーする
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch { return false; }
}
function showNote(msg) { const n = $("copyNote"); n.textContent = msg; n.hidden = false; }
function openOrCopy(e, url, copyValue, copiedMsg) {
  e.preventDefault();
  let w = null;
  try { w = window.open(url, "_blank"); } catch {}
  if (w) { try { w.opener = null; } catch {} return; }
  copyText(copyValue).then((ok) => showNote(ok ? copiedMsg : "開けませんでした：" + copyValue));
}
$("shareButton").addEventListener("click", (e) =>
  openOrCopy(e, e.currentTarget.href, SHARE_TEXT + " " + SHARE_URL, "シェア用の文章をコピーしました。Xに貼り付けて投稿してください。"));
document.querySelector(".author a").addEventListener("click", (e) =>
  openOrCopy(e, e.currentTarget.href, e.currentTarget.href, "Xのリンクをコピーしました：" + e.currentTarget.href));

// 画像の読み込み
const art = new Image();
art.decoding = "async";
art.onload = () => { renderer = new Renderer(art, () => document.createElement("canvas")); ready = true; uiKey = ""; };
art.onerror = () => { failed = true; uiKey = ""; };
art.src = ART_SRC;

// キャンバスのサイズ合わせ
function resize() {
  const r = canvas.getBoundingClientRect();
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(r.width * ratio);
  canvas.height = Math.round(r.height * ratio);
  canvas.dataset.ratio = String(ratio);
}
new ResizeObserver(resize).observe(canvas);
resize();

// 毎フレームの処理
let uiKey = "";
let switched = false;
let lastStage = "title";
function frame(now) {
  game.update(now);
  const st = game.snapshot(now);
  if (st.stage !== lastStage) {
    if (st.stage === "title") switched = false;
    if (st.stage === "end") sound.fadeOut();
    if (st.stage === "light") sound.kira();
    lastStage = st.stage;
  }
  if (st.stage === "reveal" && st.elapsed >= 1.4 && !st.paused && !switched) { switched = true; sound.switchClick(); }
  const key = `${st.stage}:${st.count}:${st.paused}:${ready}:${failed}`;
  if (key !== uiKey) { uiKey = key; renderUI(st); }
  const ratio = Number(canvas.dataset.ratio) || 1;
  const ctx = canvas.getContext("2d", { alpha: false });
  if (ctx) {
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    const w = canvas.width / ratio, h = canvas.height / ratio;
    if (renderer) renderer.paint(ctx, w, h, st);
    else { ctx.fillStyle = "#101e43"; ctx.fillRect(0, 0, w, h); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 別のタブに切り替えたら一時停止
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && game.stage !== "title" && game.stage !== "end") {
    game.pause(performance.now());
    sound.pause();
  }
});
</script>
</body>
