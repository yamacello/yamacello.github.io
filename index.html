<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YamamotoGames</title>
<meta name="description" content="やまもと しょうのブラウザゲーム">
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon.svg">
<style>
:root{color-scheme:dark;--bg:#000;--text:#e8e8e8;--muted:#777}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;line-height:1.9}
main{max-width:480px;margin:0 auto;padding:96px 16px 48px}
h1{margin:0 0 48px;font-size:22px;font-weight:400;letter-spacing:.08em}
ul{list-style:none;margin:0;padding:0}
li+li{margin-top:20px}
a{color:var(--text);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:4px}
ul a{display:flex;align-items:center;gap:16px;font-size:16px}
ul img{width:72px;height:72px;border-radius:8px;flex:none;display:block}
footer{margin-top:64px;font-size:13px;color:var(--muted)}
footer a{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>YamamotoGames</h1>

  <!-- 新しいゲームを追加するときは <li> を1行足す（新しいものを上に。サムネは thumbs/ かゲームのフォルダに置く） -->
  <ul>
    <li><a href="https://teiten-kansoku.yamamotogames.com/"><img src="thumbs/teiten-kansoku.svg?v=2" alt="" width="72" height="72">定点観測</a></li>
    <li><a href="hoshi-no-matataki/"><img src="hoshi-no-matataki/thumb.svg" alt="" width="72" height="72">数えよう！ 星のまたたき</a></li>
  </ul>

  <footer>やまもと しょう <a href="https://x.com/moya_vc" target="_blank" rel="noopener">@moya_vc</a></footer>
</main>
</body>
</html>
