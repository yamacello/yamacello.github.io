<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1a1c1d"/>
      <stop offset="1" stop-color="#0a0b0c"/>
    </radialGradient>
    <radialGradient id="metal" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#eef0ed"/>
      <stop offset=".45" stop-color="#b4b8b5"/>
      <stop offset="1" stop-color="#5a5e5c"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d716f"/>
      <stop offset=".5" stop-color="#d9dcd8"/>
      <stop offset="1" stop-color="#6d716f"/>
    </linearGradient>
  </defs>
  <!-- 手持ちの数取り器（カウンター） -->
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 指を通すリング -->
  <circle cx="100" cy="166" r="17" fill="none" stroke="url(#steel)" stroke-width="6"/>
  <!-- 押しボタン -->
  <rect x="91" y="34" width="18" height="18" fill="url(#steel)"/>
  <rect x="84" y="24" width="32" height="12" rx="3" fill="url(#steel)"/>
  <!-- 本体 -->
  <circle cx="100" cy="104" r="56" fill="url(#metal)"/>
  <circle cx="100" cy="104" r="56" fill="none" stroke="#3b3e3d" stroke-width="2"/>
  <circle cx="100" cy="104" r="49" fill="none" stroke="#fff" stroke-opacity=".25"/>
  <!-- リセットつまみ -->
  <circle cx="152" cy="82" r="7" fill="url(#steel)" stroke="#3b3e3d" stroke-width="1.5"/>
  <!-- 数字の窓 -->
  <rect x="62" y="88" width="76" height="30" rx="4" fill="#0c0d0e" stroke="#3b3e3d" stroke-width="2"/>
  <g font-family="ui-monospace,Menlo,monospace" font-size="20" font-weight="700" text-anchor="middle" fill="#e8e8e6">
    <text x="72" y="110">0</text>
    <text x="90.5" y="110">0</text>
    <text x="109.5" y="110">2</text>
    <text x="128" y="110" fill="#c9a54a">4</text>
  </g>
  <path d="M81 90V116M100 90V116M119 90V116" stroke="#2a2c2d"/>
</svg>
